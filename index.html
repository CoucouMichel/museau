<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Museau — groin ou pas groin ? Le jeu d'ambiance où l'on swipe pour démasquer les intrus." />
    <meta name="theme-color" content="#F5F1EA" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Museau</title>
    <script>
      // Applique le thème avant le premier rendu (évite un flash blanc en mode sombre).
      try {
        var s = JSON.parse(localStorage.getItem('museau.v2.settings') || '{}');
        var t = s.theme || (localStorage.getItem('museau_dark_mode') === 'true' ? 'dark' : 'system');
        if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app" class="app"></div>
    <noscript>Museau a besoin de JavaScript pour fonctionner.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
