name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:check
      - run: npm test
      - run: npm run build
      # L'ancienne version (branche ancienne-version) reste jouable sur /ancienne-version/
      - uses: actions/checkout@v4
        with:
          ref: ancienne-version
          path: legacy
      - name: Ajoute l'ancienne version au site
        run: |
          mkdir -p dist/ancienne-version
          cp legacy/index.html legacy/*.mp3 legacy/*.png dist/ancienne-version/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  # Version web jouable sur GitHub Pages (Settings › Pages › Source : GitHub Actions).
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
